<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WORD SURVIVAL ∞</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<link rel="stylesheet" href="css/estilos/principal.css">

<!-- Crosshair styles -->
<style>
  /* Punto central de la cámara (crosshair) */
  #crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    background: rgba(255,255,255,0.98);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
  }
  /* versión alternativa: líneas finas en cruz (comentadas)
  #crosshair:before, #crosshair:after{
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.95);
  }
  #crosshair:before{ width: 2px; height: 18px; left: 50%; top: -4px; transform: translateX(-50%); }
  #crosshair:after{ height: 2px; width: 18px; top: 50%; left: -4px; transform: translateY(-50%); }
  */
</style>


</head>


<body>


<div id="pantalla-inicio">

<h1>WORD SURVIVAL ∞</h1>

<button id="btn-empezar">
▶ EMPEZAR
</button>

</div>



<div id="hud-juego" style="display:none">

<div class="hud-caja">

<!-- Botón para alternar cámara -->
<button id="btn-toggle-camera" style="margin:8px;padding:6px 10px;">Cámara: 3ª</button>
<label style="margin-left:8px; font-size:0.9em; vertical-align:middle;">
  <input type="checkbox" id="chk-crosshair" checked style="vertical-align:middle"> Crosshair
</label>
<label style="margin-left:8px; font-size:0.9em; vertical-align:middle;">
  <input type="checkbox" id="chk-fp" checked style="vertical-align:middle"> First Person
</label>
<button id="btn-open-inv" style="margin-left:8px;padding:6px 10px;">Inventario (E)</button>

Nivel:
<span id="lvl">1</span>

<br>

Pos:
<span id="pos">
X:0 Z:0
</span>


<div class="barra">
<div id="b-hp" class="hp"></div>
</div>


<div class="barra">
<div id="b-mana" class="mana"></div>
</div>


<div class="barra">
<div id="b-exp" class="exp"></div>
</div>


<div class="barra">
<div id="b-hambre" class="hambre"></div>
</div>


</div>

</div>

<!-- Crosshair: punto fijo en el centro de la pantalla para apuntar -->
<div id="crosshair"></div>



<script src="js/utilidades/ruido.js"></script>

<script src="js/jugador/jugador.js"></script>

<script src="js/mundo/mundo.js"></script>

<script src="js/criaturas/criaturas.js"></script>

<script src="js/motor/motor.js"></script>
<script src="js/criaturas/cow.js"></script>
<script src="js/inventario/inventario.js"></script>

<script src="js/main/main.js"></script>


</body>

</html>
