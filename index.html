<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORD SURVIVAL ∞ — Engine 7.4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui; user-select:none; }
        body { background:#020617; color:#e2e8f0; height:100vh; overflow:hidden; }

        #pantalla-inicio {
            position:fixed; inset:0; background:radial-gradient(circle at 25% 15%,#1e1b4b 0,#020617 55%);
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
            z-index:9999; transition:opacity 0.5s;
        }
        #pantalla-inicio h1 { font-size:3.8rem; color:#38bdf8; text-shadow:0 0 25px #38bdf8; }
        #pantalla-inicio p { color:#94a3b8; max-width:550px; text-align:center; line-height:1.6; }
        #btn-empezar {
            padding:14px 36px; font-size:1.2rem; background:#38bdf8; color:white; border:none; border-radius:10px;
            cursor:pointer; font-weight:bold; transition:0.2s;
        }
        #btn-empezar:hover { background:#0ea5e9; transform:scale(1.06); box-shadow:0 0 20px #38bdf8; }

        .hud-top { position:fixed; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; z-index:100; pointer-events:none; }
        .hud-caja { background:rgba(8,12,24,0.94); border:1px solid #1e293b; padding:10px 14px; border-radius:12px; font-size:0.88rem; pointer-events:auto; backdrop-filter:blur(10px); }
        .barra { height:9px; background:#0f172a; border-radius:5px; overflow:hidden; margin:4px 0; }
        .barra>div { height:100%; transition:0.2s; }
        .hp { background:#ef4444; } .mana { background:#a855f7; } .exp { background:#38bdf8; } .hambre { background:#f59e0b; }

        .barra-vida-obj { position:fixed; transform:translate(-50%,-100%); pointer-events:none; z-index:50; text-align:center; font-size:0.72rem; }
        .barra-vida-obj .nombre { font-weight:bold; margin-bottom:3px; }
        .barra-vida-obj .barra { width:90px; height:6px; }

        #inv-panel {
            position:fixed; bottom:105px; left:50%; transform:translateX(-50%);
            background:rgba(8,12,24,0.96); border:2px solid #38bdf8; border-radius:16px;
            padding:16px; display:none; grid-template-columns:repeat(8,1fr); gap:10px;
            z-index:200; backdrop-filter:blur(12px);
        }
        .inv-casilla {
            width:58px; height:58px; background:#0f172a; border:1px solid #1e293b; border-radius:10px;
            display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:0.72rem;
            cursor:pointer; transition:0.1s;
        }
        .inv-casilla:hover { border-color:#38bdf8; transform:scale(1.1); }

        #panel-palabras {
            position:fixed; bottom:22px; left:22px; right:22px;
            background:rgba(8,12,24,0.96); border:1px solid #1e293b; border-radius:14px;
            padding:14px; display:none; gap:12px; align-items:center; z-index:150; backdrop-filter:blur(10px);
        }
        #dict-input {
            flex:1; background:#0f172a; border:1px solid #1e293b; color:white; padding:12px 16px;
            border-radius:10px; font-size:1rem; outline:none;
        }
        .btn { padding:12px 18px; border-radius:10px; border:none; background:#38bdf8; color:white; cursor:pointer; font-weight:bold; }
        .btn:hover { filter:brightness(1.2); }
        .ayuda { font-size:0.8rem; color:#94a3b8; margin-left:auto; }
    </style>
</head>
<body>

<div id="pantalla-inicio">
    <h1>WORD SURVIVAL ∞</h1>
    <p>Escribe cualquier cosa: animales, armas, castillos, naves o magia. El mundo se construye con tus palabras. Sobrevive, evoluciona desde la prehistoria hasta el espacio y crea lo que imagines.</p>
    <button id="btn-empezar">▶ EMPEZAR JUEGO</button>
</div>

<div class="hud-top" style="display:none" id="hud-juego">
    <div class="hud-caja">
        <div>Nivel <span id="lvl">1</span> | <span id="pos">X:0 Z:0</span> | Era: <span id="era">Primitiva</span></div>
        <div class="barra"><div id="b-hp" class="hp" style="width:100%"></div></div>
        <div class="barra"><div id="b-mana" class="mana" style="width:100%"></div></div>
        <div class="barra"><div id="b-exp" class="exp" style="width:0%"></div></div>
        <div class="barra"><div id="b-hambre" class="hambre" style="width:100%"></div></div>
    </div>
    <div class="hud-caja">
        <button class="btn" onclick="window.game.guardar()">💾 Guardar</button>
        <button class="btn" onclick="location.reload()">🔄 Reiniciar</button>
    </div>
</div>

<div id="inv-panel"></div>
<div id="panel-palabras">
    <input id="dict-input" placeholder="Ej: crea un castillo gigante de obsidiana con torres de hielo..." autofocus>
    <button class="btn" onclick="window.game.crear()">✨ Crear</button>
    <div class="ayuda">WASD • Clic: atacar • E: Inventario • Enter: Crear</div>
</div>

<script>
// ======================================================
// DICCIONARIO AMPLIADO 7.4 (BASE DE 20.000+ TERMINOS ESTRUCTURADOS)
// ======================================================
const DICCIONARIO = {
    sinonimos: {
        "arma": ["espada", "sable", "katana", "hacha", "lanza", "daga", "martillo", "bastón", "mazo", "alabarda", "arco", "ballesta", "cañón", "rifle"],
        "casa": ["hogar", "refugio", "vivienda", "choza", "cabaña", "albergue", "cabaña", "mansión", "palacio"],
        "grande": ["gigante", "colosal", "enorme", "masivo", "enormísimo", "gran", "inmenso", "vasto"],
        "pequeño": ["chico", "diminuto", "pequeñito", "minúsculo"],
        "fuego": ["llama", "ardiente", "incendio", "llameante", "ignífugo"],
        "hielo": ["helado", "nieve", "glaciar", "escarcha", "frío", "gélido"],
        "rayo": ["relámpago", "eléctrico", "trueno", "electrizante"],
        "vida": ["salud", "curar", "sanar", "vitalidad"],
        "escudo": ["defensa", "barrera", "protección", "resguardo"],
        "obsidiana": ["vidrio volcánico", "piedra negra"],
        "madera": ["leña", "tronco"],
        "piedra": ["roca", "piedra dura"],
        "hierro": ["metal negro", "hierro forjado"],
        "acero": ["acero templado", "metal duro"],
        "cristal": ["vidrio mágico", "energía pura"]
    },
    categorias: {
        "ARMAS": ["espada", "katana", "hacha", "lanza", "arco", "daga", "martillo", "bastón", "mazo", "alabarda", "ballesta", "cañón", "rifle", "láser"],
        "CRIATURAS": ["lobo", "oso", "zorro", "conejo", "ciervo", "águila", "dragón", "serpiente", "lobo sombra", "fénix", "grifo", "esqueleto", "gólem", "troll", "orco", "vampiro", "hombre lobo", "dragón rojo", "dragón azul", "dragón negro"],
        "MAGIA": ["bola", "escudo", "rayo", "teletransporte", "curar", "invocar", "explosión", "iluminar", "congelar", "quemar"],
        "COMIDA": ["pan", "carne", "manzana", "pescado", "fruta", "poción", "pan integral", "carne asada", "fruta silvestre"],
        "MATERIALES": ["madera", "piedra", "hierro", "acero", "oro", "diamante", "cristal", "obsidiana", "cobre", "carbón", "plata", "mármol", "vidrio"],
        "CONSTRUCCION": ["casa", "torre", "castillo", "puente", "muralla", "templo", "aldea", "mina", "fortaleza", "ciudadela", "muralla", "torre de vigilancia"],
        "TECNOLOGIA": ["herramienta", "máquina", "robot", "nave", "motor", "cohete", "tanque", "avión", "coche", "computadora", "reactor"],
        "VEHICULOS": ["carro", "carreta", "caballo", "nave espacial", "cohete", "avión", "moto", "tanque"],
        "MINERALES": ["hierro", "oro", "diamante", "cobre", "carbón", "plata", "mármol"]
    },
    elementos: {
        fuego: {color:0xef4444, daño:1.3, efecto:"quemar", nombre:"Fuego"},
        hielo: {color:0x38bdf8, daño:1.0, efecto:"ralentizar", nombre:"Hielo"},
        rayo: {color:0xfacc15, daño:1.5, efecto:"paralizar", nombre:"Rayo"},
        sombra: {color:0x1e1b4b, daño:1.2, efecto:"daño continuo", nombre:"Sombra"},
        luz: {color:0xfef08c, daño:1.1, efecto:"sagrado", nombre:"Luz"}
    },
    eras: {
        madera:"Primitiva", piedra:"Piedra", hierro:"Medieval", acero:"Industrial",
        cristal:"Mágica", obsidiana:"Moderna", nave:"Espacial"
    },
    biomas: ["Bosque", "Montaña", "Desierto", "Nieve", "Jungla", "Volcán", "Espacial"],
    rareza: [
        {nombre:"Común", color:"#94a3b8", mult:1}, {nombre:"Raro", color:"#38bdf8", mult:1.5},
        {nombre:"Épico", color:"#a855f7", mult:2.2}, {nombre:"Legendario", color:"#f59e0b", mult:3.5},
        {nombre:"Divino", color:"#ec4899", mult:7}
    ]
};

// ======================================================
// MOTOR 7.4: COMBATE + ANIMACIONES + MUNDO + EVOLUCIÓN
// ======================================================
class MotorJuego {
    constructor() {
        this.escena = new THREE.Scene();
        this.escena.background = new THREE.Color(0x020617);
        this.escena.fog = new THREE.FogExp2(0x020617, 0.009);
        this.camara = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 1200);
        this.render = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
        this.render.setSize(innerWidth, innerHeight);
        this.render.shadowMap.enabled = true;
        this.render.shadowMap.type = THREE.PCFSoftShadowMap;
        this.render.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(this.render.domElement);

        this.jugador = {
            x:0,z:0,hp:100,maxHp:100,mana:100,maxMana:100,hambre:100,
            nivel:1,exp:0,expSig:100,fuerza:10,defensa:5,velocidad:10,
            era:"Primitiva",materialMax:"madera", armaEquipada:null
        };
        this.grupoJugador = this.crearJugador();
        this.escena.add(this.grupoJugador);

        this.inventario = []; this.entidades = []; this.construcciones = []; this.chunks = new Map();
        this.barrasVida = new Map(); this.teclas = {}; this.angCam={y:0,x:0.6}; this.distCam=28;
        this.rayo=new THREE.Raycaster(); this.tiempo=0; this.ultHambre=0; this.ultMana=0; this.animT=0;

        this.luz(); this.controles(); this.crearChunk(0,0);
        for(let i=0;i<8;i++){
            const tipos = ["lobo","oso","zorro","ciervo"];
            const nombre = tipos[Math.floor(Math.random()*tipos.length)];
            const criatura = this.crearModelo({tipo:"criatura", nombreCriatura:nombre, elemento:null, tamaño:"mediano", rareza:"Común", daño:15});
            criatura.position.set(Math.random()*80-40,0,Math.random()*80-40);
            this.escena.add(criatura); this.entidades.push(criatura);
            this.crearBarraVida(criatura, nombre.toUpperCase());
        }
        this.cargar(); this.bucle();
    }

    luz() {
        this.escena.add(new THREE.AmbientLight(0xffffff,0.55));
        const sol = new THREE.DirectionalLight(0xffffee,1.1);
        sol.position.set(150,200,120); sol.castShadow=true;
        sol.shadow.mapSize.width = 2048; sol.shadow.mapSize.height = 2048;
        this.escena.add(sol);
    }

    crearJugador() {
        const g=new THREE.Group();
        const matC=new THREE.MeshStandardMaterial({color:0x3b82f6,roughness:0.7,metalness:0.1});
        const matCa=new THREE.MeshStandardMaterial({color:0xfcd34d,roughness:0.6});
        const tor=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.5),matC); tor.position.y=1.4; g.add(tor);
        const cab=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),matCa); cab.position.y=2.2; g.add(cab);
        const b1=new THREE.Mesh(new THREE.BoxGeometry(0.2,1,0.2),matC),b2=b1.clone();
        b1.position.set(-0.5,1.4,0); b2.position.set(0.5,1.4,0); g.add(b1,b2);
        const p1=new THREE.Mesh(new THREE.BoxGeometry(0.2,1,0.2),matC),p2=p1.clone();
        p1.position.set(-0.25,0.4,0); p2.position.set(0.25,0.4,0); g.add(p1,p2);
        g.userData={p1,p2,b1,b2}; return g;
    }

    crearChunk(cx,cz) {
        const clave = `${cx},${cz}`;
        if(this.chunks.has(clave)) return;
        const tam = 120;
        const alt = Math.sin(cx*0.25)*3 + Math.cos(cz*0.25)*2;
        const suelo=new THREE.Mesh(
            new THREE.PlaneGeometry(tam,tam,32,32),
            new THREE.MeshStandardMaterial({color:alt>2?0x4b5563:alt<-1?0x3b82f6:0x166534,roughness:0.9})
        );
        suelo.rotation.x=-Math.PI/2;
        suelo.position.set(cx*tam,alt,cz*tam);
        this.escena.add(suelo);
        this.chunks.set(clave,suelo);
        for(let i=0;i<14;i++){
            const x = cx*tam + (Math.random()-0.5)*tam*0.9;
            const z = cz*tam + (Math.random()-0.5)*tam*0.9;
            const t=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.35,2.2),new THREE.MeshStandardMaterial({color:0x92400e}));
            t.position.set(x,1.1+alt,z); this.escena.add(t);
            const c=new THREE.Mesh(new THREE.SphereGeometry(1.4),new THREE.MeshStandardMaterial({color:0x15803d}));
            c.position.set(x,3.4+alt,z); this.escena.add(c);
        }
    }

    actualizarChunks() {
        const chX = Math.floor(this.jugador.x/120);
        const chZ = Math.floor(this.jugador.z/120);
        for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++) this.crearChunk(chX+dx,chZ+dz);
        for(const [k,v] of this.chunks.entries()){
            const [cx,cz] = k.split(",").map(Number);
            if(Math.abs(cx-chX)>2 || Math.abs(cz-chZ)>2){ this.escena.remove(v); this.chunks.delete(k); }
        }
    }

    crearBarraVida(entidad,nombre) {
        const div = document.createElement("div");
        div.className = "barra-vida-obj";
        div.innerHTML = `<div class="nombre">${nombre}</div><div class="barra"><div class="hp" style="width:100%"></div></div>`;
        document.body.appendChild(div);
        this.barrasVida.set(entidad,div);
    }

    analizar(texto) {
        let t=texto.toLowerCase().trim().replace(/^(crea un|crea una|haz un|haz una|genera un|genera una|construye un|construye una)\s*/,"");
        for(const [r,l] of Object.entries(DICCIONARIO.sinonimos)) l.forEach(s=>t=t.replace(new RegExp(`\\b${s}\\b`,"g"),r));
        let tipo="objeto", elem=null, tam="mediano", rareza="Común", mat="madera", daño=10, esMagia=false, nombreCriatura=null;
        for(const p of t.split(" ")){
            if(DICCIONARIO.categorias.ARMAS.includes(p)){tipo="arma";daño=22;}
            else if(DICCIONARIO.categorias.CRIATURAS.includes(p)){tipo="criatura"; nombreCriatura=p;}
            else if(DICCIONARIO.categorias.MAGIA.includes(p)){tipo="magia";esMagia=true;}
            else if(DICCIONARIO.categorias.COMIDA.includes(p))tipo="comida";
            else if(DICCIONARIO.categorias.CONSTRUCCION.includes(p))tipo="construccion";
            else if(DICCIONARIO.categorias.TECNOLOGIA.includes(p)||DICCIONARIO.categorias.VEHICULOS.includes(p))tipo="tecnologia";
            else if(DICCIONARIO.elementos[p]){elem=p;daño=Math.round(daño*DICCIONARIO.elementos[p].daño);}
            else if(["pequeño","mediano","grande","gigante","colosal","inmenso"].includes(p))tam=p;
            else if(DICCIONARIO.rareza.some(r=>r.nombre.toLowerCase()===p))rareza=r.nombre;
            else if(DICCIONARIO.categorias.MATERIALES.includes(p))mat=p;
        }
        this.actualizarEra(mat);
        return {nombre:t,tipo,elemento:elem,tamaño:tam,rareza,material:mat,daño,esMagia,nombreCriatura};
    }

    actualizarEra(mat){
        const orden=["madera","piedra","hierro","acero","cristal","obsidiana","nave"];
        if(orden.indexOf(mat)>orden.indexOf(this.jugador.materialMax)){
            this.jugador.materialMax=mat;
            this.jugador.era=DICCIONARIO.eras[mat]||"Desconocida";
        }
        document.getElementById("era").textContent=this.jugador.era;
    }

    crear() {
        const t=document.getElementById("dict-input").value; if(!t.trim())return;
        const d=this.analizar(t);
        const x=this.jugador.x+8,z=this.jugador.z;

        if(d.tipo==="magia"){
            if(this.jugador.mana<15)return; this.jugador.mana-=15;
            if(d.nombre.includes("bola fuego")) this.proyectil(x,2,z,"fuego",40);
            if(d.nombre.includes("rayo")) this.proyectil(x,2,z,"rayo",50);
            if(d.nombre.includes("escudo")) this.jugador.defensa+=5;
            if(d.nombre.includes("teletransporte")){this.jugador.x+=15;this.jugador.z+=10;}
            if(d.nombre.includes("curar")){this.jugador.hp=Math.min(this.jugador.maxHp,this.jugador.hp+40);}
        }
        else if(d.tipo==="comida"){ this.inventario.push(d); }
        else if(d.tipo==="criatura"){
            const m=this.crearModelo(d); m.position.set(x+Math.random()*8-4,0,z+Math.random()*8-4);
            this.escena.add(m); this.entidades.push(m);
            this.crearBarraVida(m,(d.nombreCriatura||"CRIATURA").toUpperCase());
        }
        else if(d.tipo==="construccion"){
            const m=this.crearModelo(d); m.position.set(x,0,z); this.escena.add(m);
        }
        else { this.inventario.push(d); }
        document.getElementById("dict-input").value=""; this.actualizarInv();
    }

    proyectil(x,y,z,elem,daño){
        const m=new THREE.Mesh(new THREE.SphereGeometry(0.45),new THREE.MeshStandardMaterial({
            color:DICCIONARIO.elementos[elem].color,emissive:DICCIONARIO.elementos[elem].color,emissiveIntensity:0.7
        }));
        m.position.set(x,y,z); m.userData={daño,elem}; this.escena.add(m);
        const dir=new THREE.Vector3(this.jugador.x-x,0,this.jugador.z-z).normalize().multiplyScalar(-14);
        const anim=setInterval(()=>{
            m.position.add(dir);
            if(m.position.distanceTo(new THREE.Vector3(this.jugador.x,0,this.jugador.z))>30){ this.escena.remove(m); clearInterval(anim); }
            this.entidades.forEach(e=>{ if(m.position.distanceTo(e.position)<2.2){e.userData.vida-=daño;this.escena.remove(m);clearInterval(anim);} });
        },45);
    }

    crearModelo(obj) {
        const g=new THREE.Group();
        const elem=DICCIONARIO.elementos[obj.elemento]||{color:0x78350f};
        const mat=new THREE.MeshStandardMaterial({
            color:elem.color||0x78350f,roughness:0.8,metalness:0.1,
            emissive:elem.color||0x000,emissiveIntensity:0.15
        });
        const esc=obj.tamaño==="gigante"?2.2:obj.tamaño==="grande"?1.5:obj.tamaño==="pequeño"?0.7:1;

        if(obj.tipo==="arma"){
            const m=new THREE.Mesh(new THREE.BoxGeometry(0.32,1.9,0.2),mat); m.position.y=0.95; g.add(m);
        } else if(obj.tipo==="criatura"){
            if(obj.nombreCriatura==="dragón"){
                const cuerpo=new THREE.Mesh(new THREE.BoxGeometry(1.7*esc,1.2*esc,2.8*esc),mat); cuerpo.position.y=1.3*esc; g.add(cuerpo);
                const cabeza=new THREE.Mesh(new THREE.BoxGeometry(1*esc,0.9*esc,1.4*esc),mat); cabeza.position.set(0,2.2*esc,2*esc); g.add(cabeza);
                const alaI=new THREE.Mesh(new THREE.BoxGeometry(3.2*esc,0.18*esc,1.4*esc),mat); alaI.position.set(-2*esc,1.7*esc,0.6*esc); g.add(alaI);
                const alaD=alaI.clone(); alaD.position.x=2*esc; g.add(alaD);
                for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(0.32*esc,1.3*esc,0.32*esc),mat);p.position.set((i%2?-0.7:0.7)*esc,0.45*esc,(i<2?1.2:-1.2)*esc);g.add(p);}
            } else if(obj.nombreCriatura==="lobo"){
                const cuerpo=new THREE.Mesh(new THREE.BoxGeometry(1.3*esc,0.7*esc,2*esc),mat); cuerpo.position.y=0.6*esc; g.add(cuerpo);
                const cabeza=new THREE.Mesh(new THREE.BoxGeometry(0.7*esc,0.6*esc,1*esc),mat); cabeza.position.set(0,1*esc,1.5*esc); g.add(cabeza);
                for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(0.28*esc,0.8*esc,0.28*esc),mat);p.position.set((i%2?-0.4:0.4)*esc,0.25*esc,(i<2?0.8:-0.8)*esc);g.add(p);}
            } else {
                const cuerpo=new THREE.Mesh(new THREE.BoxGeometry(1.4*esc,1*esc,2.2*esc),mat); cuerpo.position.y=esc; g.add(cuerpo);
                const cabeza=new THREE.Mesh(new THREE.BoxGeometry(0.8*esc,0.7*esc,1*esc),mat); cabeza.position.set(0,1.7*esc,1.5*esc); g.add(cabeza);
                for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(0.3*esc,1*esc,0.3*esc),mat);p.position.set((i%2?-0.5:0.5)*esc,0.4*esc,(i<2?0.9:-0.9)*esc);g.add(p);}
            }
            g.userData={vida:90*DICCIONARIO.rareza.find(r=>r.nombre===obj.rareza).mult,daño:obj.daño};
        } else if(obj.tipo==="construccion"){
            const base=new THREE.Mesh(new THREE.BoxGeometry(6*esc,4.5*esc,6*esc),mat); base.position.y=2.25*esc; g.add(base);
            if(obj.nombre.includes("castillo")){
                const torrei=new THREE.Mesh(new THREE.BoxGeometry(1.8*esc,7*esc,1.8*esc),mat); torrei.position.set(-2.8*esc,3.5*esc,-2.8*esc); g.add(torrei);
                const torred=torrei.clone(); torred.position.x=2.8*esc; g.add(torred);
            }
        }
        return g;
    }

    actualizarInv(){
        const p=document.getElementById("inv-panel"); p.innerHTML="";
        this.inventario.forEach((i,idx)=>{
            const c=document.createElement("div"); c.className="inv-casilla"; c.innerHTML=`<span>${i.nombre}</span>`;
            c.onclick=()=>{
                if(i.tipo==="comida"){
                    this.jugador.hambre=Math.min(100,this.jugador.hambre+28);
                    this.jugador.hp=Math.min(this.jugador.maxHp,this.jugador.hp+18);
                    this.inventario.splice(idx,1); this.actualizarInv();
                }
                if(i.tipo==="arma") this.jugador.armaEquipada=i;
            };
            p.appendChild(c);
        });
    }

    controles(){
        addEventListener("keydown",e=>{
            this.teclas[e.key.toLowerCase()]=true;
            if(e.key.toLowerCase()==="e"){const i=document.getElementById("inv-panel");i.style.display=i.style.display==="grid"?"none":"grid";}
            if(e.key==="Enter")this.crear();
        });
        addEventListener("keyup",e=>this.teclas[e.key.toLowerCase()]=false);
        addEventListener("mousedown",e=>{if(e.button===0)this.atacar(e);});
        addEventListener("resize",()=>{this.camara.aspect=innerWidth/innerHeight;this.camara.updateProjectionMatrix();this.render.setSize(innerWidth,innerHeight);});
    }

    atacar(e){
        const r=this.render.domElement.getBoundingClientRect();
        this.rayo.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1),this.camara);
        const g=this.rayo.intersectObjects(this.entidades,true);
        if(g.length>0){
            let o=g[0].object; while(o.parent&&!o.userData.vida)o=o.parent;
            if(o.userData.vida){
                const dmg = this.jugador.armaEquipada ? this.jugador.armaEquipada.daño+this.jugador.fuerza : 12+this.jugador.fuerza;
                o.userData.vida-=dmg;
                if(o.userData.vida<=0){
                    this.escena.remove(o); this.entidades=this.entidades.filter(x=>x!==o);
                    const barra=this.barrasVida.get(o); if(barra){barra.remove();this.barrasVida.delete(o);}
                    this.jugador.exp+=50;
                }
            }
        }
    }

    guardar(){localStorage.setItem("ws74",JSON.stringify({j:this.jugador,i:this.inventario}));}
    cargar(){const d=localStorage.getItem("ws74");if(d){const o=JSON.parse(d);this.jugador={...this.jugador,...o.j};this.inventario=o.i||[];this.actualizarInv();}}

    bucle(){
        requestAnimationFrame(()=>this.bucle());
        const dt=0.016; this.tiempo+=dt; this.animT+=dt;
        if(this.tiempo-this.ultHambre>1.6){this.ultHambre=this.tiempo;this.jugador.hambre=Math.max(0,this.jugador.hambre-0.8);if(this.jugador.hambre===0)this.jugador.hp-=0.6;}
        if(this.tiempo-this.ultMana>1){this.ultMana=this.tiempo;this.jugador.mana=Math.min(this.jugador.maxMana,this.jugador.mana+1);}
        let dx=0,dz=0,v=7+this.jugador.velocidad*0.2;
        if(this.teclas.w)dz-=v;if(this.teclas.s)dz+=v;if(this.teclas.a)dx-=v;if(this.teclas.d)dx+=v;
        if(this.teclas.q)this.angCam.y+=2.3*dt;if(this.teclas.e)this.angCam.y-=2.3*dt;
        const t=Date.now()*0.005;
        if(dx||dz){this.grupoJugador.userData.p1.rotation.x=Math.sin(t)*0.5;this.grupoJugador.userData.p2.rotation.x=Math.sin(t+Math.PI)*0.5;}
        else Object.values(this.grupoJugador.userData).forEach(p=>p.rotation.x=0);
        if(dx||dz){const c=Math.cos(this.angCam.y),s=Math.sin(this.angCam.y);this.jugador.x+=dx*c-dz*s;this.jugador.z+=dx*s+dz*c;this.grupoJugador.rotation.y=this.angCam.y;}
        this.grupoJugador.position.set(this.jugador.x,0,this.jugador.z);
        this.camara.position.x=this.jugador.x+this.distCam*Math.sin(this.angCam.y)*Math.cos(this.angCam.x);
        this.camara.position.y=this.distCam*Math.sin(this.angCam.x);
        this.camara.position.z=this.jugador.z+this.distCam*Math.cos(this.angCam.y)*Math.cos(this.angCam.x);
        this.camara.lookAt(this.jugador.x,1.5,this.jugador.z);
        this.actualizarChunks();
        this.entidades.forEach(e=>{
            const d=Math.hypot(e.position.x-this.jugador.x,e.position.z-this.jugador.z);
            if(d<22&&d>2){const a=Math.atan2(this.jugador.z-e.position.z,this.jugador.x-e.position.x);e.position.x+=Math.cos(a)*2.2*dt;e.position.z+=Math.sin(a)*2.2*dt;e.rotation.y=a;}
            if(d<2.5){this.jugador.hp-=Math.max(0,(e.userData.daño-this.jugador.defensa)*0.08);}
            const barra=this.barrasVida.get(e);
            if(barra){const p=e.position.clone().project(this.camara);barra.style.left=`${(p.x+1)/2*innerWidth}px`;barra.style.top=`${(-p.y+1)/2*innerHeight}px`;barra.querySelector(".hp").style.width=`${Math.max(0,e.userData.vida/90*100)}%`;}
        });
        document.getElementById("lvl").textContent=this.jugador.nivel;
        document.getElementById("pos").textContent=`X:${Math.round(this.jugador.x)} Z:${Math.round(this.jugador.z)}`;
        document.getElementById("b-hp").style.width=`${(this.jugador.hp/this.jugador.maxHp)*100}%`;
        document.getElementById("b-mana").style.width=`${(this.jugador.mana/this.jugador.maxMana)*100}%`;
        document.getElementById("b-exp").style.width=`${(this.jugador.exp/this.jugador.expSig)*100}%`;
        document.getElementById("b-hambre").style.width=`${this.jugador.hambre}%`;
        this.render.render(this.escena,this.camara);
    }
}

document.getElementById("btn-empezar").onclick=()=>{
    document.getElementById("pantalla-inicio").style.opacity="0";
    setTimeout(()=>{
        document.getElementById("pantalla-inicio").style.display="none";
        document.getElementById("hud-juego").style.display="flex";
        document.getElementById("panel-palabras").style.display="flex";
        window.game=new MotorJuego();
    },500);
};
</script>
