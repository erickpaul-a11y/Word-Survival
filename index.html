<!DOCTYPE html>
<html>
<head>

<title>Word Survival 1.2</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
}

canvas{
display:block;
}

</style>

</head>

<body>

<canvas id="game"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


canvas.width=window.innerWidth;
canvas.height=window.innerHeight;



// MUNDO

let world={
width:5000,
height:5000
};



let camera={
x:0,
y:0
};



// JUGADOR

let player={

x:2500,
y:2500,

size:35,

speed:6,

life:100,

words:[]

};



// CONTROLES

let keys={};


document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});




// BASE DE PALABRAS

let wordDatabase=[

{
word:"madera",
type:"material"
},

{
word:"piedra",
type:"material"
},

{
word:"fuego",
type:"elemento"
},

{
word:"agua",
type:"recurso"
},

{
word:"hierro",
type:"material"
},

{
word:"espada",
type:"arma"
}

];




// PALABRAS EN EL MAPA

let wordsOnMap=[];


for(let i=0;i<100;i++){


let data=
wordDatabase[
Math.floor(Math.random()*wordDatabase.length)
];


wordsOnMap.push({

x:Math.random()*world.width,

y:Math.random()*world.height,

word:data.word,

type:data.type

});


}





// ENEMIGOS

let enemies=[];


for(let i=0;i<20;i++){

enemies.push({

x:Math.random()*world.width,

y:Math.random()*world.height,

size:30,

speed:2

});

}




// ACTUALIZAR

function update(){


// movimiento

if(keys["w"])
player.y-=player.speed;

if(keys["s"])
player.y+=player.speed;

if(keys["a"])
player.x-=player.speed;

if(keys["d"])
player.x+=player.speed;




camera.x=player.x-canvas.width/2;
camera.y=player.y-canvas.height/2;




// recoger palabras


wordsOnMap.forEach((w,index)=>{


let dx=player.x-w.x;
let dy=player.y-w.y;


let distance=Math.sqrt(dx*dx+dy*dy);



if(distance<50){


player.words.push(w);


wordsOnMap.splice(index,1);


}


});



}




// DIBUJAR

function draw(){


ctx.clearRect(0,0,canvas.width,canvas.height);



// suelo

ctx.fillStyle="#3b703b";

ctx.fillRect(
-camera.x,
-camera.y,
world.width,
world.height
);



// palabras

wordsOnMap.forEach(w=>{


ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(
w.x-camera.x,
w.y-camera.y,
15,
0,
Math.PI*2
);

ctx.fill();



ctx.fillStyle="white";

ctx.font="14px Arial";

ctx.fillText(
w.word,
w.x-camera.x-25,
w.y-camera.y-20
);



});




// enemigos

ctx.fillStyle="red";


enemies.forEach(e=>{

ctx.fillRect(

e.x-camera.x,

e.y-camera.y,

e.size,

e.size

);

});




// jugador

ctx.fillStyle="cyan";


ctx.fillRect(

player.x-camera.x,

player.y-camera.y,

player.size,

player.size

);




// inventario

ctx.fillStyle="white";

ctx.font="20px Arial";


ctx.fillText(

"Palabras: "+player.words.length,

20,

30

);



if(player.words.length>0){


ctx.font="15px Arial";


ctx.fillText(

"Última: "+player.words[player.words.length-1].word,

20,

55

);


}



}





function loop(){

update();

draw();

requestAnimationFrame(loop);

}


loop();


</script>

</body>

</html>
